spring:
  application:
    name: game-elements-service
  datasource:
    username: ${GAME_ELEMENTS_DB_USER}
    password: ${GAME_ELEMENTS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  lifecycle:
    timeout-per-shutdown-phase: 30s # Tempo massimo concesso a ogni fase di arresto
server:
  shutdown: graceful # Consente alle richieste in corso di terminare entro il timeout
