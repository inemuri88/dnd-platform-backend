server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      # NB: questo progetto usa spring-cloud-starter-gateway-mvc (gateway basato su Spring MVC),
      # quindi le route stanno sotto 'gateway.mvc.routes'.
      mvc:
        routes:
          # 'uri: lb://<nome-servizio>' => risoluzione tramite Eureka + load balancing client-side.
          # I nomi (user-service, ...) devono combaciare con spring.application.name di ciascun servizio.
          - id: user-service
            uri: lb://user-service
            predicates:
              - Path=/api/auth/**,/api/users/**
          - id: game-elements-service
            uri: lb://game-elements-service
            predicates:
              - Path=/api/game-elements/**
          - id: character-service
            uri: lb://character-service
            predicates:
              - Path=/api/characters/**
          - id: campaign-service
            uri: lb://campaign-service
            predicates:
              - Path=/api/campaigns/**
          - id: chat-service
            uri: lb://chat-service
            predicates:
              - Path=/api/chat/**
          - id: map-service
            uri: lb://map-service
            predicates:
              - Path=/api/maps/**

# Chiave HMAC condivisa: serve al gateway per validare il JWT prima di inoltrare la richiesta a valle.
security:
  jwt:
    secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # Esponiamo anche 'prometheus' perche' il gateway ha il registry Micrometer/Prometheus
        include: health,info,prometheus,gateway